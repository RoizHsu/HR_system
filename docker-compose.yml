services:
  backend:
    build:
      context: .
      dockerfile: ./dockerfile.backend
    image: hr-django-backend:v3  #簡單本地名稱
    container_name: hr-backend 
    ports:
      - "8000:8000"
    volumes:
      - ./HR_system:/app
    environment:
      - DEBUG=1

  frontend:
    build:
      context: ./HR_web
      dockerfile: dockerfile.frontend
    image: hr-vue-frontend:v3   #簡單本地名稱
    container_name: hr-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./HR_web:/app
      - /app/node_modules

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "SQLServer123!"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
 sql_data: